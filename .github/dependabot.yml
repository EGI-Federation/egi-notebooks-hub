---
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  # python packages
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
  # docker image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
